in: top left; opacity: 1; display: block; filter: none"><div style="position: relative; width: 100%; height: 100%"><div style="left: 0; top: 0; position: absolute; width: 383.105357px; color: rgb(255, 255, 255); white-space: pre-wrap; overflow-wrap: break-word; font-size: 47px; text-align: left; font-family: 'Poppins'; text-decoration: none; text-decoration-skip-ink: none; text-transform: none; line-height: 1.027; letter-spacing: 0px; font-style: normal; font-weight: bold" id="el-text_3"><style>#el-text_3 {
  p {
    margin: 0;
    padding: 0;
    overflow-wrap: break-word; /* Canonical CSS3 — Firefox honors it; render-tag's CSS resolver only parses this canonical form */
    /* a text may have several spaces, we need to preserve them */
    white-space: pre-wrap;
  }

  /* Structural list reset. Native markers are intentionally LEFT ENABLED here
     (no list-style:none) so the canonical export/canvas HTML renders the
     browser's NATIVE markers.

     The per-level indent is carried by the <ul>/<ol> padding (2.1em), NOT the
     <li>. This matters for native markers: with list-style-position outside
     the marker hangs just left of the <li> border box, so the indent must sit
     on the list (the marker lands inside that padding, next to the text). If
     the indent were on the <li> instead, the outside marker would hang at
     x near 0 and be clipped off the element's left edge. render-tag computes
     the same content-start either way (it accumulates block padding).

     The live editor needs the opposite box model (indent on the <li>, so its
     absolutely-positioned ::before marker has room) and overrides these two
     paddings in rich-editor.tsx. */
  ul, ol {
    padding-inline-start: 2.1em; /* Per-level indent; native outside markers hang inside it */
    margin: 0;
    display: block; /* Use block instead of inline-block for better text wrapping */
    width: 100%;
    /* border-box so width:100% INCLUDES the indent padding — otherwise the
       content box overflows the element by 2.1em and native center/right
       text-align drifts right (left is unaffected). render-tag already lays the
       list out border-box, so this is what keeps DOM (html export) aligned with
       the canvas. Editor lists override padding to 0 (rich-editor.tsx), so this
       is a no-op there. */
    box-sizing: border-box;
    text-decoration: inherit;
  }

  li {
    padding-inline-start: 0;
    margin: 0; /* Reset default li margins */
    overflow-wrap: break-word; /* Canonical CSS3 — Firefox honors it; render-tag's CSS resolver only parses this canonical form */
    white-space: pre-wrap; /* Preserve spaces and allow wrapping */
  }

  /* Paragraph block-indent (matches walk's <p> ql-indent → margin in
     rich-text-html.ts). Small step, applied to non-list indented blocks.
     Editor-only in practice: the export normalizer turns <p> ql-indent into an
     inline margin, so canonical export HTML carries no ql-indent class. */
  .ql-indent-1 {
    margin-inline-start: 0.5em;
  }
  .ql-indent-2 {
    margin-inline-start: 1em;
  }
  .ql-indent-3 {
    margin-inline-start: 1.5em;
  }

  /* List nesting indent for the live Quill editor, which renders a list FLAT
     (one container, depth via ql-indent on each <li>). Each level is indented
     by the SAME 2.1em render-tag adds per nested <ul>/<ol>, to stay in sync
     with the canvas. Stored/exported lists are canonical-nested and carry no
     ql-indent (see canonicalizeLists), so these rules are editor/legacy-only
     no-ops elsewhere. */
  li.ql-indent-1 {
    margin-inline-start: 2.1em;
  }
  li.ql-indent-2 {
    margin-inline-start: 4.2em;
  }
  li.ql-indent-3 {
    margin-inline-start: 6.3em;
  }
